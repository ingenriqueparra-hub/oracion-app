<div class="auth-page">
  <div class="auth-header">
    <div class="logo-icon">🙏</div>
    <h1>Intercede</h1>
    <p>Únete a la comunidad</p>
  </div>

  @if (success()) {
    <div class="auth-card success-card">
      <div class="success-icon">✉️</div>
      <h2>¡Casi listo!</h2>
      <p>Revisa tu correo y confirma tu cuenta para poder ingresar.</p>
      <a routerLink="/login" class="btn-primary">Ir al inicio de sesión</a>
    </div>
  } @else {
    <form class="auth-card" [formGroup]="form" (ngSubmit)="onSubmit()">
      <h2>Crear cuenta</h2>

      <div class="field">
        <label for="name">Nombre completo</label>
        <input
          id="name"
          type="text"
          formControlName="name"
          placeholder="Tu nombre"
          autocomplete="name"
        >
      </div>

      <div class="field">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="tu@correo.com"
          autocomplete="email"
        >
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Mínimo 6 caracteres"
          autocomplete="new-password"
        >
      </div>

      @if (error()) {
        <p class="error-msg">{{ error() }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="loading()">
        @if (loading()) { Creando cuenta... } @else { Crear cuenta }
      </button>

      <p class="auth-link">
        ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
      </p>
    </form>
  }
</div>
