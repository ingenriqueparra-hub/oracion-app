<div class="welcome-page">
  <div class="welcome-brand">
    <span class="brand-icon">🙏</span>
    <h1>Intercede</h1>
    <p>Ora con tu comunidad</p>
  </div>

  @if (step() === 'root') {
    <div class="welcome-actions">
      <button class="btn-primary" (click)="step.set('login')">Ya tengo cuenta, ingresar</button>
      <button class="btn-outline" (click)="step.set('register')">Soy nuevo, registrarme</button>
    </div>
  }

  @if (step() === 'login') {
    <div class="welcome-actions">      
      <button type="button" class="btn-google" (click)="onGoogleLogin()" [disabled]="googleLoading()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        @if (googleLoading()) { Conectando... } @else { Continuar con Google }
      </button>

      <a routerLink="/login" class="btn-primary">Ingresar con correo</a>
      <a routerLink="/pin-login" class="btn-outline">Entrar sin correo</a>
      @if (error()) {
        <p class="error-msg">{{ error() }}</p>
      }
      <a class="btn-ghost" (click)="step.set('root')">← Volver</a>
    </div>
  }

  @if (step() === 'register') {
    <div class="welcome-actions">      
      <button type="button" class="btn-google" (click)="onGoogleLogin()" [disabled]="googleLoading()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        @if (googleLoading()) { Conectando... } @else { Registrarse con Google }
      </button>
      <a routerLink="/register" class="btn-primary">Registrarme con correo</a>
      <a routerLink="/pin-register" class="btn-outline">Registrarme sin correo</a>
      @if (error()) {
        <p class="error-msg">{{ error() }}</p>
      }
      <a class="btn-ghost" (click)="step.set('root')">← Volver</a>
    </div>
  }
</div>
