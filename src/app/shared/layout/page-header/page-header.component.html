<header class="page-header">
  @if (backLink != null || showBack) {
    <button class="back-button" (click)="goBack()">←</button>
  }
  @if (title) {
    <h1>{{ title }}</h1>
  } @else {
    <span class="spacer"></span>
  }
  @if (actionLabel && actionLink) {
    <a [routerLink]="actionLink" class="btn-action">{{ actionLabel }}</a>
  } @else if (actionLabel) {
    <button type="button" class="btn-action" (click)="actionClick.emit()">{{ actionLabel }}</button>
  }
</header>
