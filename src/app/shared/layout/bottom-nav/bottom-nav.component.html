<nav class="bottom-nav">
  <a routerLink="/prayers" routerLinkActive="active" class="bottom-item">
    <mat-icon class="bottom-icon">home</mat-icon>
    <span class="bottom-label">Oración</span>
  </a>

  @if (user()?.church_id) {
    <a [routerLink]="churchLink" routerLinkActive="active" class="bottom-item">
      <mat-icon class="bottom-icon">church</mat-icon>
      <span class="bottom-label">Mi Iglesia</span>
    </a>
  } @else {
    <a routerLink="/churches" routerLinkActive="active" class="bottom-item">
      <mat-icon class="bottom-icon">explore</mat-icon>
      <span class="bottom-label">Iglesias</span>
    </a>
  }

  <a routerLink="/testimonies" routerLinkActive="active" class="bottom-item">
    <mat-icon class="bottom-icon">auto_awesome</mat-icon>
    <span class="bottom-label">Testimonios</span>
  </a>

  <button class="bottom-item" (click)="openSheet()">
    <mat-icon class="bottom-icon">person</mat-icon>
    <span class="bottom-label">Perfil</span>
  </button>
</nav>

@if (showSheet()) {
  <div class="sheet-backdrop" (click)="closeSheet()"></div>
  <div class="bottom-sheet">
    <div class="sheet-handle"></div>

    @if (user()) {
      <div class="sheet-header">
        <div class="sheet-avatar">
          @if (user()?.avatar_url) {
            <img [src]="user()!.avatar_url + '?t=' + timestamp" [alt]="user()!.name">
          } @else {
            {{ user()!.name.charAt(0).toUpperCase() }}
          }
        </div>
        <div class="sheet-user-info">
          <span class="sheet-user-name">{{ user()!.name }}</span>
          <span class="sheet-user-level">{{ user()!.level }}</span>
        </div>
      </div>
      <div class="sheet-divider"></div>
    }

    <button class="sheet-item" (click)="navigate('/profile')">
      <mat-icon class="sheet-icon">person</mat-icon>
      <span>Ver mi perfil</span>
    </button>
    <button class="sheet-item" (click)="navigate('/profile/edit')">
      <mat-icon class="sheet-icon">edit</mat-icon>
      <span>Editar perfil</span>
    </button>
    <button class="sheet-item" (click)="navigate('/my-prayers')">
      <mat-icon class="sheet-icon">list</mat-icon>
      <span>Mis pedidos</span>
    </button>
    <button class="sheet-item" (click)="navigate('/ranking')">
      <mat-icon class="sheet-icon">emoji_events</mat-icon>
      <span>Ranking</span>
    </button>
    <div class="sheet-divider"></div>
    <button class="sheet-item sheet-logout" (click)="logout()">
      <mat-icon class="sheet-icon">logout</mat-icon>
      <span>Cerrar sesión</span>
    </button>
  </div>
}
